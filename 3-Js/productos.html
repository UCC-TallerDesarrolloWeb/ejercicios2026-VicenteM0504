<!DOCTYPE html>
<html>

<head>
    <title>Catalogo de productos</title>
    <link href="catalogo.css" type="text/css" rel="stylesheet">
    <script type="text/javascript" src="tienda.js"></script>
</head>

<body class="grid-container" onload="mostrarCatalogo()">
    <header class="item1">
        Catalogo de productos
    </header>
    <nav class="item2">
        <a href="productos.html">Catalogo de productos</a>
        <a href="carrito.html">Carritos de compras</a>
        <div id="cant-prod">0</div>
    </nav>
    <aside class="item3">
        <form name="filter" id="filter">
        <fieldset>

            <legend>Buscador</legend>
            <label for="search">Buscar</label>
            <input type="text" name="search" id="search" placeholder="Buscar.." onchange="filtrarProductos()">

        </fieldset>
        <fieldset>
            <legend>Precios</legend>
            <p>
                <label for="price-min">Minimo</label>
                <input type="number" name="price-min" id="price-min" min="0" onchange="filtrarProductos()">
            </p>
            <p>
                <label for="price-max">Maximo</label>
                <input type="number" name="price-max" id="price-max" min="0" onchange="filtrarProductos()">
            </p>
        </fieldset>
        <fieldset>
            <legend>Marca</legend>
                <select id="marca" onchange="filtrarProducto()">
                    <option value="Todas">Todas</option>
                    <option value="Gran Marc">Gran Marc</option>
                    <option value="Daedo">Daedo</option>


                </select>
            
        <fieldset>
            <legend>Tipo de productos</legend>
            <p>
                <input type="checkbox" name="tipo" id="protectores" value="protectores" onchange="filtrarProductos()">
                <label for="protectores">Protectores</label>
            </p>
            <p>
                <input type="checkbox" name="tipo" id="entrenamiento" value="entrenamiento" onchange="filtrarProductos()">
                <label for="entrenamiento">Entrenamiento</label>
            </p>
            <p>
                <input type="checkbox" name="tipo" id="dobok" value="dobok"onchange="filtrarProductos()">
                <label for="dobok">Dobok</label>
            </p>
        </fieldset>
        <fieldset>
            <legend>Ordenar catalogo</legend>
            <select id="order" onchange="ordenarCatalogo()">
                <option value="mayor">por precio - de Mayor a Menor</option>
                <option value="menor">por precio - de Menor a Mayor</option>
                <option value="a-z">por nombre - de A -Z</option>
                <option value="z-a">por nombre - de Z -A</option>


            </select>
        </fieldset>
        </form>
    </aside>
    <dialog id="modal">
            <h2 id="nombre-producto">Cabezal cerrad</h2>
            <p id="descripcion-producto">Cabezal de sparring disponible en color azul o rojo</p>
            <button type="button" onclick="cerrarModal()">Cerrar</button>
        </dialog>
    <main class="item4" id="catalogo">

    </main>

    <footer class="item5">
        Contacto
    </footer>

</body>

</html>
